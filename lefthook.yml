# Lefthook configuration — đã hiệu chỉnh để chạy thật được trên repo này:
# - Không dùng eslint/prettier/commitlint ở root (repo không cài các tool đó ở root)
# - Gọi script npm của từng package thay vì npx eslint {staged_files}
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint-frontend:
      glob: "frontend/**/*.{js,jsx,mjs}"
      run: npm run lint:frontend
    lint-backend:
      glob: "backend/**/*.{ts,js}"
      run: npm run lint:backend
    typecheck:
      glob: "backend/**/*.ts"
      run: npm --prefix backend/nest-api run typecheck
